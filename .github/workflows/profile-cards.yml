name: Update profile cards

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-cards.yml
      - .github/scripts/validate-profile-cards.py
      - .github/scripts/normalize-profile-cards.py
      - .github/scripts/publish-profile-cards.sh
  schedule:
    # 11:17 Asia/Shanghai; avoid the busiest start of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # Generate into a separate directory. Never overwrite a published card
      # until every new card has rendered and passed validation.
      - name: Generate light stats
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&locale=cn&bg_color=0000
          path: .profile-card-build/stats-light.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate dark stats
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&locale=cn&bg_color=0000
          path: .profile-card-build/stats-dark.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate light languages
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&locale=cn&bg_color=0000
          path: .profile-card-build/top-langs-light.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate dark languages
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&locale=cn&bg_color=0000
          path: .profile-card-build/top-langs-dark.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate light streak
        uses: DenverCoder1/github-readme-streak-stats@55b1994a6d5825f57f748b622cd64d5ea54989a0 # v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&locale=zh_Hans&background=0000
          path: .profile-card-build/streak-light.svg
          token: ${{ github.token }}

      - name: Generate dark streak
        uses: DenverCoder1/github-readme-streak-stats@55b1994a6d5825f57f748b622cd64d5ea54989a0 # v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&locale=zh_Hans&background=0000
          path: .profile-card-build/streak-dark.svg
          token: ${{ github.token }}

      - name: Validate all cards
        run: python3 .github/scripts/validate-profile-cards.py .profile-card-build

      - name: Publish validated cards
        run: bash .github/scripts/publish-profile-cards.sh .profile-card-build base

  project-pins:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate light website pin
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=qilinbro.github.io&hide_border=true&locale=cn&bg_color=0000&description_lines_count=3
          path: .profile-card-build/pin-website-light.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate dark website pin
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=qilinbro.github.io&theme=tokyonight&hide_border=true&locale=cn&bg_color=0000&description_lines_count=3
          path: .profile-card-build/pin-website-dark.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate light social pin
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=A2A-Social-graphy-universe&hide_border=true&locale=cn&bg_color=0000&description_lines_count=3
          path: .profile-card-build/pin-social-light.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate dark social pin
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=A2A-Social-graphy-universe&theme=tokyonight&hide_border=true&locale=cn&bg_color=0000&description_lines_count=3
          path: .profile-card-build/pin-social-dark.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate light game pin
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=game-friends&hide_border=true&locale=cn&bg_color=0000&description_lines_count=3
          path: .profile-card-build/pin-game-light.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate dark game pin
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=game-friends&theme=tokyonight&hide_border=true&locale=cn&bg_color=0000&description_lines_count=3
          path: .profile-card-build/pin-game-dark.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate light image-grid pin
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=image-grid-generator&hide_border=true&locale=cn&bg_color=0000&description_lines_count=3
          path: .profile-card-build/pin-image-grid-light.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Generate dark image-grid pin
        uses: stats-organization/github-readme-stats-action@96a939a7398a290e0a9f84b2b31d21d0cf67d483 # v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=image-grid-generator&theme=tokyonight&hide_border=true&locale=cn&bg_color=0000&description_lines_count=3
          path: .profile-card-build/pin-image-grid-dark.svg
          token: ${{ github.token }}
          fail_on_error: true

      - name: Publish validated project pins
        run: bash .github/scripts/publish-profile-cards.sh .profile-card-build pins

  summary-cards:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # The official Action writes only its scratch output directory. It may
      # report partial API errors without failing, so validate every SVG below.
      - name: Generate default summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f # release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          AUTO_PUSH: false
          THEME: default

      - name: Stage default summary cards
        run: |
          mkdir -p .profile-card-build/summary-default
          for card in 0-profile-details 1-repos-per-language 2-most-commit-language 3-stats 4-productive-time; do
            cp "profile-summary-card-output/default/$card.svg" ".profile-card-build/summary-default/$card.svg"
          done

      - name: Generate dark summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f # release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          AUTO_PUSH: false
          THEME: tokyonight

      - name: Stage dark summary cards
        run: |
          mkdir -p .profile-card-build/summary-tokyonight
          for card in 0-profile-details 1-repos-per-language 2-most-commit-language 3-stats 4-productive-time; do
            cp "profile-summary-card-output/tokyonight/$card.svg" ".profile-card-build/summary-tokyonight/$card.svg"
          done

      - name: Publish validated summary cards
        run: bash .github/scripts/publish-profile-cards.sh .profile-card-build summary

  contribution-3d:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Isolate official 3D output in temporary storage
        run: |
          mkdir -p "$RUNNER_TEMP/profile-3d-output"
          ln -s "$RUNNER_TEMP/profile-3d-output" profile-3d-contrib

      - name: Generate 3D contribution views
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 100

      - name: Stage the two requested 3D views
        run: |
          mkdir -p .profile-card-build/3d
          cp "$RUNNER_TEMP/profile-3d-output/profile-green-animate.svg" .profile-card-build/3d/
          cp "$RUNNER_TEMP/profile-3d-output/profile-night-green.svg" .profile-card-build/3d/

      - name: Publish validated 3D contribution views
        run: bash .github/scripts/publish-profile-cards.sh .profile-card-build 3d
