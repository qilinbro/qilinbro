  <title id="banner-title-dark">Kirin — code, mechanical engineering, and learning in public</title>
  <desc id="banner-desc-dark">Kirin is a student and future full-stack developer studying mechanical engineering. An original engineering blueprint combines a precision wheel assembly, branching code paths, and a growing seedling. Light and dark editions use teal and restrained warm gold details.</desc>
