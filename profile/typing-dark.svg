<svg xmlns="http://www.w3.org/2000/svg" width="760" height="48" viewBox="0 0 760 48" role="img" aria-labelledby="typing-title-dark typing-desc-dark">
  <title id="typing-title-dark">Keep learning. Keep creating.</title>
  <desc id="typing-desc-dark">A gentle three-line message rotation: Keep learning. Keep creating.; Code × Machines × Curiosity; Building tools, sharing field notes. Reduced motion shows the first message without animation.</desc>
  <style>
    .message { font-family: 'Trebuchet MS', 'Verdana', sans-serif; font-size: 23px; fill: #58c9b9; text-anchor: middle; }
    .line-one { animation: message-one 18s linear infinite; }
    .line-two { animation: message-two 18s linear infinite; }
    .line-three { animation: message-three 18s linear infinite; }
    @keyframes message-one { 0%, 28% { opacity: 1; } 33%, 94% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes message-two { 0%, 28% { opacity: 0; } 33%, 61% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes message-three { 0%, 61% { opacity: 0; } 66%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line-one, .line-two, .line-three { animation: none; }
      .line-one { opacity: 1; }
      .line-two, .line-three { opacity: 0; }
    }
  </style>
  <g fill="none" stroke="#29414c" stroke-width="1.3" stroke-linecap="round">
    <path d="M125 13H116V35H125 M635 13H644V35H635"/>
    <path d="M133 24H154 M606 24H627"/>
  </g>
  <g class="message line-one" opacity="1"><text x="380" y="31">Keep learning. Keep creating.</text></g>
  <g class="message line-two" opacity="0"><text x="380" y="31">Code × Machines × Curiosity</text></g>
  <g class="message line-three" opacity="0"><text x="380" y="31">Building tools, sharing field notes.</text></g>
</svg>
